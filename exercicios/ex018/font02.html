<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externos</title>
    <style>
        @font-face {
            font-family: 'love';
            src: url("fonts/love larry ttf.ttf") format('truetype');
            font-weight: normal;
            font-style: normal;
            /* 
                tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat (apple advanced typrgraphy)
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'love';
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Laudantium aperiam cumque, fugiat temporibus est odit id nesciunt unde optio consequatur aliquam reprehenderit repellat iste perspiciatis eaque ex soluta quo molestiae?</p>
</body>
</html>
