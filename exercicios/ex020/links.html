<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /*  SELETORES PERSONALIZADOS
            # = id
            . = clas
            : = Pseudo-class
            :: = Pseudo-element
            > = clildren
         */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
            text-decoration: none;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }
        .especial {
            background-color: lightcoral;
        }
        .especial::before {
            content: '→ ';
        }
        .especial::after {
            content: ' ←';
        }
    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" rel="external" target="_blank">Repositorio do github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" rel="External" target="_blank" class="especial">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" rel="External" target="_blank" class="especial">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
