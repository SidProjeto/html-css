<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminue o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagems/P.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagems/M.png" type="image/png">
        <img src="imagems/G.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em html5</p>
    <audio preload="metadata" controls>
        <source src="midia/Pajama_Party_Jeremy_Korpas.mp3" type="audio/mpeg">
        <source src="midia/Pajama_Party_Jeremy_Korpas.mp3" type="audio/ogg">
        <source src="midia/Pajama_Party_Jeremy_Korpas.mp3" type="wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/Pajama_Party_Jeremy_Korpas.mp3" download="Pajama_Party_Jeremy_Korpas.mp3" type="audio/mpeg">Clique aquipara baixar o arquivo mp3</a> </p>
    </audio>
</body>
</html>
