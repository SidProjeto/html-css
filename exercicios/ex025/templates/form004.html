<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" minlength="3" maxlength="30" required autocomplete="name" placeholder="Nome Completo">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" required autocomplete="email" placeholder="exemplo@gmail.com">
            </p>
            <p>
                <label for="tel">Telefone:</label>
                <input type="tel" name="tel" required autocomplete="tel" pattern='^\(\d{2}\)\d{4,5}-\d{4}$' placeholder="(xx)xxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
