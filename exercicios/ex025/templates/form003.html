<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form method="get" autocomplete="on">
        <p><label for="nome">nome:</label>
        <input type="text" name="nome" required maxlength="30" placeholder="Nome Completo" autocomplete="name">
    </p>
    <p>
        <label for="media">Média</label>
        <input type="number" name="media" minlength="0" max="10" placeholder="0 a 10" step="0.1" required value="5">
    </p>
    <p><label for="mes">Período Letivo</label>
    <input type="month" name="mes" value="2026-09">
    </p>
    <p>
        <label for="dia">Dia da Prova</label>
        <input type="date" name="dia" value="2026-09-14">
    </p>
    <p>
        <label for="hora">Horário da Prova</label>
        <input type="time" name="hora">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>

</body>
</html>
