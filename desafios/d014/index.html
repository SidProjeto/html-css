<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        td,th {
            border: 1px solid black;
            padding: 5px;
            font-weight: bold;
        }
        caption {
            font-weight: bold;
            font-size: 1.3em;
            padding: 10px;
            background-color: black;
            color: white;
        }
        tr.col {
            background-color: gray;
            color: white;
        }
        tbody > tr.col > th {
            text-align: left;
        }
         td {
            text-align: center;
        }
        td.materia {
            text-align: left;
        }
    </style>
  </head>
  <body>
    <table>
        <caption>
          Boletim
        </caption>
      <thead>
        <tr class="col">
            <th rowspan="2" scope="col">Área</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Média</th>
        </tr>
        <tr class="col">
            <th scope="col">nota 1</th>
            <th scope="col">nota 2</th>
        </tr>
      </thead>
      <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td class="materia">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="col">
                <th colspan="4" scope="row">Média de Exatas</th>
                <td>0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                 <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                 <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr class="col">
            <th colspan="4" scope="row">Média de Humanas</th>
            <td>0.0</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
